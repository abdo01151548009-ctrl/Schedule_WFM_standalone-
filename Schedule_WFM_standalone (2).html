<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule — جدولة الموظفين</title>
<style>
:root{
  --bg:#0f1720; --panel:#17212c; --panel2:#1d2a37; --line:#2a3a49;
  --text:#e8edf2; --sub:#8fa3b3; --accent:#3aa6a0; --accent2:#2d8882;
  --warn:#e0a458; --danger:#d9705c; --shift:#2d5f8a; --shift2:#3a78ad;
  --break:#c97f3a; --radius:10px;
  color-scheme: dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:14px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--panel)}
header{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;color:var(--text)}
header h1 span{color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--panel2);border-radius:8px;padding:3px}
.tabs button{border:none;background:transparent;color:var(--sub);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.tabs button.active{background:var(--accent);color:#06211f;font-weight:600}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06211f;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
main{padding:14px 16px 60px;max-width:1300px;margin:0 auto}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select,.toolbar input[type=date]{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:8px;font-size:13px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.reports{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.rcard .num{font-size:20px;font-weight:700;color:var(--accent)}
.rcard .lbl{color:var(--sub);font-size:12px;margin-top:2px}

/* Vertical Timeline (Calabrio-style) — employees as columns, time as rows */
:root{--namew:72px; --colw:132px; --hour-h:52px}
.tlx-wrap{direction:ltr;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 280px);min-height:320px;position:relative}
.tl-inner{min-width:max-content}
.tl-header-row{display:flex;position:sticky;top:0;z-index:20;background:var(--panel2);border-bottom:1px solid var(--line)}
.tl-corner{position:sticky;left:0;z-index:25;background:var(--panel2);border-right:1px solid var(--line);padding:10px 4px;font-size:11px;color:var(--sub);min-width:var(--namew);width:var(--namew);text-align:center;flex-shrink:0}
.tl-emps-h{display:flex}
.tl-emp-h{border-right:1px solid var(--line);padding:8px 5px;min-width:var(--colw);width:var(--colw);text-align:center;flex-shrink:0}
.tl-emp-h b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.tl-emp-h small{color:var(--sub);font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-body-row{display:flex}
.tl-time-col{position:sticky;left:0;z-index:12;background:var(--panel);border-right:1px solid var(--line);width:var(--namew);min-width:var(--namew);flex-shrink:0}
.tl-time-slot{height:var(--hour-h);border-bottom:1px solid var(--line);padding:2px 3px;font-size:11px;color:var(--sub);display:flex;align-items:flex-start;justify-content:center}
.tl-cols{display:flex}
.tl-col{position:relative;border-right:1px solid var(--line);width:var(--colw);min-width:var(--colw);flex-shrink:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour-h) - 1px),rgba(42,58,73,.65) calc(var(--hour-h) - 1px),rgba(42,58,73,.65) var(--hour-h))}
.tl-col .now{position:absolute;left:0;right:0;border-top:2px solid var(--danger);z-index:4;pointer-events:none}
.shift-block{position:absolute;left:4px;right:4px;border:1px solid rgba(0,0,0,.3);border-radius:6px;cursor:pointer;overflow:hidden;padding:4px 5px;font-size:11px;line-height:1.25;z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15);display:flex;flex-direction:column;justify-content:flex-start;transition:filter .12s,box-shadow .12s}
.shift-block:hover{filter:brightness(1.12);box-shadow:0 3px 10px rgba(0,0,0,.45);z-index:6}
.shift-block b{font-size:11px;font-weight:700;white-space:nowrap}
.shift-block span{opacity:.85;font-size:10px}
.shift-block.clipT{border-top-left-radius:2px;border-top-right-radius:2px;border-top:3px solid rgba(255,255,255,.7)}
.shift-block.clipB{border-bottom-left-radius:2px;border-bottom-right-radius:2px;border-bottom:3px solid rgba(255,255,255,.7)}
.shift-block.done{opacity:.72}
.brk{position:absolute;left:0;right:0;z-index:4;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;overflow:hidden;white-space:nowrap;border-top:1px solid rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.45);box-shadow:0 0 0 1px rgba(0,0,0,.2);color:#10202e}
.brk:hover{filter:brightness(1.12)}
.leave-block{position:absolute;left:0;right:0;opacity:.9;border-radius:0;box-shadow:inset 0 0 0 999px rgba(15,23,32,.45);z-index:1;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 8px,transparent 8px 16px)}
.breakrow.hl{outline:2px solid var(--accent);border-radius:6px}
.empty-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:16px;opacity:0;pointer-events:none}
.tl-col:hover .empty-hint{opacity:.35}
/* toolbar */
.tbar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.tb-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb-row select,.tb-row input[type=date],.tb-row input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;min-width:0}
.tb-row input[type=search]{flex:1 1 200px;max-width:320px}
.tb-btn,.zoomctl button{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12.5px}
.tb-btn:hover,.zoomctl button:hover,.datenav button:hover{border-color:var(--accent)}
.datenav{direction:ltr}
.zoomctl{display:flex;align-items:center;gap:5px;direction:ltr}
.zoomctl button{width:30px;height:30px;padding:0;font-size:16px;line-height:1}
.zoomctl button#zoomFit{width:auto;padding:0 11px;font-size:12.5px}
#zoomLbl{min-width:44px;text-align:center;font-size:12px;color:var(--sub)}
.rangectl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.rangectl select{padding:5px 8px}
.rangectl .chk{display:flex;align-items:center;gap:4px;cursor:pointer}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-inline-start:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.reports{grid-template-columns:repeat(5,minmax(0,1fr))}
main{max-width:1700px}
@media (max-width:900px){.reports{grid-template-columns:repeat(3,minmax(0,1fr))}.legend{display:none}}
@media (max-width:760px){
  :root{--namew:56px; --colw:110px}
  header{flex-wrap:wrap;gap:6px;padding:8px 10px}
  header .btn{padding:6px 9px;font-size:12px}
  #userChip{display:none}
  main{padding:10px 10px 50px}
  .reports{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px}
  .rcard{flex:0 0 108px;padding:6px 8px}.rcard .num{font-size:15px}.rcard .lbl{font-size:10px;white-space:nowrap}
  .tbar{gap:6px;margin-bottom:8px}
  .tb-row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .tb-row::-webkit-scrollbar{display:none}
  .tb-row>*{flex:0 0 auto}
  .tb-row select{flex:0 0 auto;max-width:150px}
  .tb-row input[type=search]{flex:0 0 170px;max-width:170px}
  .rangectl{flex-wrap:nowrap;white-space:nowrap}
  .tlx-wrap{max-height:calc(100vh - 250px)}
}
/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card h3{margin:0 0 2px;font-size:15px}
.card .dept{color:var(--sub);font-size:12px;margin-bottom:10px}
.card .row{display:flex;justify-content:space-between;font-size:13px;margin:4px 0;color:var(--sub)}
.card .row b{color:var(--text)}
.card .bar{height:10px;border-radius:5px;background:var(--panel2);margin:8px 0;position:relative;overflow:hidden}
.card .bar .f{position:absolute;inset:0;background:var(--shift)}
.card .bar .b{position:absolute;top:0;bottom:0;background:var(--break)}
.card .actions{display:flex;gap:6px;margin-top:10px}
.card .actions .btn{flex:1;padding:6px;text-align:center}
.noshift{color:var(--sub);font-style:italic;font-size:13px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:20px;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:440px;margin-top:40px}
.modal h2{margin:0 0 14px;font-size:16px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:7px;font-size:13px}
.twofield{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.breaklist{border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:4px}
.breakrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.breakrow select,.breakrow input{flex:1;padding:6px;font-size:12px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.err{color:var(--danger);font-size:12px;min-height:14px;margin-top:4px}

@media (max-width:760px){
  header h1{font-size:15px}
}

/* Admin */
.admin-shell{position:fixed;inset:0;background:var(--bg);z-index:60;display:none}
.admin-shell.open{display:flex}
.admin-sidebar{width:210px;background:var(--panel);border-left:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;flex-shrink:0;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.admin-sidebar .brand{padding:0 16px 14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line);margin-bottom:8px}
.admin-sidebar button{display:block;width:100%;text-align:start;background:none;border:none;color:var(--sub);padding:10px 16px;cursor:pointer;font-size:13px}
.admin-sidebar button.active{color:var(--text);background:var(--panel2);border-right:3px solid var(--accent)}
.admin-sidebar .logout{margin-top:auto;color:var(--danger)}
.admin-main{flex:1;overflow:auto;padding:20px 24px calc(50px + env(safe-area-inset-bottom,0px));padding-top:calc(20px + env(safe-area-inset-top,0px))}
.admin-main h2{margin-top:0}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.dtable{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:13px}
.dtable th,.dtable td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start}
.dtable th{background:var(--panel2);color:var(--sub);font-weight:600;font-size:12px}
.dtable tr:last-child td{border-bottom:none}
.pill{padding:2px 8px;border-radius:20px;font-size:11px}
.pill.on{background:#1f4a3a;color:#7adfb0}
.pill.off{background:#4a2020;color:#e08f8f}
.admin-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.admin-toolbar input,.admin-toolbar select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px}
.colorrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.colorrow span{flex:1;font-size:13px}
.colorrow input[type=color]{width:38px;height:28px;border:none;background:none;cursor:pointer}
.colorrow input[type=text]{width:90px}
.loginwrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200}
.loginwrap.open{display:flex}
.loginbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:300px}
.pwfield{position:relative}
.pwfield button{position:absolute;inset-inline-end:8px;top:7px;background:none;border:none;color:var(--sub);cursor:pointer;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:8px;z-index:300;font-size:13px}
.leave-block{position:absolute;top:0;bottom:0;opacity:.35;z-index:1}
small.muted{color:var(--sub);display:block;margin-top:10px;font-size:12px}

/* ---- Phase 1 (standalone): accounts + roles ---- */
#loginWrap{background:var(--bg)}
#loginWrap .loginbox{width:340px;max-width:92vw}
.userchip{color:var(--sub);font-size:12px;white-space:nowrap}
.ownerOnly{display:none!important}
.role-owner .ownerOnly{display:block!important}
.role-viewer #addShiftBtn,.role-viewer #addEmpBtn,.role-viewer #adminBtn,.role-viewer .delS,.role-viewer .addS,
.role-viewer #saveShiftBtn,.role-viewer #delShiftBtn,.role-viewer #addBreakBtn,.role-viewer #shiftOverlay .rmBrk{display:none!important}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:start;vertical-align:top}
.tbl .btn{padding:3px 8px;font-size:12px;margin-inline-end:4px}
.warnbox{background:#3a2a10;border:1px solid #8a6a2a;color:#f0d9a8;padding:8px 10px;border-radius:8px;font-size:12px;margin:8px 0}

.stepper{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 14px}.stepper span{font-size:11px;padding:3px 8px;border-radius:12px;background:#262b30;color:var(--sub)}
.stepper .done{background:#27493f;color:#cfeee0}.stepper .cur{background:#3aa6a0;color:#fff}
.gridbox{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:8px}
.gridtbl{border-collapse:collapse;font-size:11px}.gridtbl th,.gridtbl td{border:1px solid var(--line);padding:2px;min-width:84px;text-align:center}
.gridtbl th:first-child,.gridtbl td:first-child{position:sticky;inset-inline-start:0;background:var(--bg);z-index:2;min-width:140px;text-align:start;padding:2px 6px}
.gridtbl thead th{position:sticky;top:0;background:var(--bg);z-index:3}.gridtbl thead th:first-child{z-index:4}
.gridtbl select{width:100%;font-size:11px;background:transparent;color:inherit;border:0}
.c-block{outline:2px solid #d9534f;outline-offset:-2px}.c-warn{outline:2px solid #e0a030;outline-offset:-2px}
.c-leave{background:repeating-linear-gradient(45deg,#4a2a2a,#4a2a2a 6px,#3a2020 6px,#3a2020 12px)}.c-off{background:#2a3038}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;margin-inline-end:6px;margin-bottom:4px}
.b-block{background:#5a2323}.b-warn{background:#5a4a1d}.b-info{background:#1f3a52}.b-ok{background:#1f4a35}
</style>
</head>
<body>
<header>
  <h1>Schedule<span> · WFM</span></h1>
  <div class="tabs">
    <button id="tabTimeline" class="active">Timeline</button>
    <button id="tabCards">Cards</button>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="langBtn">EN</button>
  <button class="btn primary" id="addShiftBtn">+ Shift</button>
  <button class="btn" id="addEmpBtn">+ Employee</button>
  <button class="btn" id="adminBtn">Admin</button>
  <span class="userchip" id="userChip"></span>
  <button class="btn" id="logoutBtn">Logout</button>
</header>
<main>
  <div class="reports" id="reports"></div>
  <div class="tbar">
    <div class="tb-row">
      <div class="datenav">
        <button id="prevDay" title="Previous day">‹</button>
        <input type="date" id="dateInput">
        <button id="nextDay" title="Next day">›</button>
        <button id="todayBtn" class="tb-btn">Today</button>
      </div>
      <select id="fDept"></select>
      <select id="fEmp"></select>
      <select id="fStatus">
        <option value="">All statuses</option>
        <option value="scheduled">Scheduled</option>
        <option value="completed">Completed</option>
        <option value="noshift">No shift</option>
        <option value="leave">On leave</option>
      </select>
      <input type="search" id="fSearch" placeholder="Search name, ID, team…" autocomplete="off">
    </div>
    <div class="tb-row" id="tlControls">
      <div class="zoomctl"><button id="zoomOut" title="Zoom out">−</button><span id="zoomLbl">100%</span><button id="zoomIn" title="Zoom in">+</button><button id="zoomFit">Fit</button></div>
      <div class="rangectl"><span id="lblFrom">From</span><select id="rngStart"></select><span id="lblTo">To</span><select id="rngEnd"></select><label class="chk"><input type="checkbox" id="rngAuto"><span id="lblAuto">Auto-fit to shifts</span></label><button id="rngFull" class="tb-btn">Full day</button></div>
      <div class="legend" id="tlLegend"></div>
    </div>
  </div>
  <div id="viewTimeline"></div>
  <div id="viewCards" style="display:none"></div>
</main>

<div class="overlay" id="shiftOverlay">
  <div class="modal">
    <h2 id="shiftModalTitle">New shift</h2>
    <input type="hidden" id="shiftId">
    <div class="field"><label>Employee</label><select id="sEmp"></select></div>
    <div class="field"><label>Date</label><input type="date" id="sDate"></div>
    <div class="twofield">
      <div class="field"><label>Start</label><input type="time" id="sStart"></div>
      <div class="field"><label>End (next day if earlier)</label><input type="time" id="sEnd"></div>
    </div>
    <div class="field"><label>Status</label>
      <select id="sStatus"><option value="scheduled">Scheduled</option><option value="completed">Completed</option></select>
    </div>
    <div class="field"><label>Breaks</label>
      <div class="breaklist" id="breakList"></div>
      <button class="btn" id="addBreakBtn" style="margin-top:6px;font-size:12px">+ Break</button>
    </div>
    <div class="err" id="shiftErr"></div>
    <div class="actions">
      <button class="btn danger" id="delShiftBtn" style="display:none">Delete</button>
      <button class="btn" id="cancelShiftBtn">Cancel</button>
      <button class="btn primary" id="saveShiftBtn">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="empOverlay">
  <div class="modal">
    <h2 id="empModalTitle">New employee</h2>
    <input type="hidden" id="empId">
    <div class="field"><label>Full name</label><input id="eName"></div>
    <div class="twofield">
      <div class="field"><label>Employee #</label><input id="eNum"></div>
      <div class="field"><label>Department</label><input id="eDept"></div>
    </div>
    <div class="twofield">
      <div class="field"><label>Team</label><input id="eTeam"></div>
      <div class="field"><label>Job title</label><input id="eTitle"></div>
    </div>
    <div class="twofield">
      <div class="field"><label>Phone</label><input id="ePhone"></div>
      <div class="field"><label>Email</label><input id="eEmail" type="email"></div>
    </div>
    <div class="field"><label>Status</label><select id="eStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
    <div class="field"><label>Default shift template</label><select id="eTpl"></select></div>
    <div class="field"><label>Weekly off days</label><div id="eOff" style="display:flex;gap:10px;flex-wrap:wrap"><label><input type="checkbox" value="0"> Sun</label><label><input type="checkbox" value="1"> Mon</label><label><input type="checkbox" value="2"> Tue</label><label><input type="checkbox" value="3"> Wed</label><label><input type="checkbox" value="4"> Thu</label><label><input type="checkbox" value="5"> Fri</label><label><input type="checkbox" value="6"> Sat</label></div></div>
    <div class="err" id="empErr"></div>
    <div class="actions">

<script>
const STORE_KEY='wfm_schedule_data_v1';
const START_HOUR=9, TOTAL_HOURS=15; // 09:00 -> 24:00 (midnight)
let state={employees:[],shifts:[]};
let lang='ar', view='timeline';
function localISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
let currentDate=localISO(new Date());

function uid(){return Math.random().toString(36).slice(2,9)}
const DEFAULT_COLORS={morning:'#3aa6a0',evening:'#3a78ad',night:'#5a4ab0',weekly:'#607080',annual:'#4a9d5f',sick:'#c9553a',holiday:'#9c6b3a',emergency:'#b03a3a',custom:'#7a7a7a'};
const DEFAULT_BREAK_TYPES=[{id:'break',name:'Break',color:'#c97f3a'},{id:'lunch',name:'Lunch',color:'#b0552e'},{id:'prayer',name:'Prayer',color:'#4a8f6e'},{id:'personal',name:'Personal',color:'#8a6ab0'},{id:'training',name:'Training',color:'#3a7fb0'},{id:'meeting',name:'Meeting',color:'#b0a23a'}];
function migrate(){
  state.employees.forEach(e=>{ if(e.title===undefined)e.title=''; if(e.phone===undefined)e.phone=''; if(e.email===undefined)e.email=''; if(e.status===undefined)e.status='active'; });
  if(!state.breakTypes) state.breakTypes=JSON.parse(JSON.stringify(DEFAULT_BREAK_TYPES));
  if(!state.daysOff) state.daysOff=[];
  if(!state.colors) state.colors=JSON.parse(JSON.stringify(DEFAULT_COLORS));
  if(!state.settings) state.settings={}; delete state.settings.adminPassword;
  if(!state.log) state.log=[];
  if(!state.shiftTemplates) state.shiftTemplates=[{id:'tpl_m',name:'Morning',start:'08:00',end:'16:00',color:state.colors.morning||'#3aa6a0',teams:[]},{id:'tpl_e',name:'Evening',start:'16:00',end:'00:00',color:state.colors.evening||'#3a78ad',teams:[]},{id:'tpl_n',name:'Night',start:'22:00',end:'06:00',color:state.colors.night||'#5a4ab0',teams:[]}];
  if(!state.breakTemplates) state.breakTemplates=[];
  if(!state.importHistory) state.importHistory=[]; if(!state.genHistory) state.genHistory=[];
  state.employees.forEach(e=>{ if(e.tpl===undefined) e.tpl=''; if(!Array.isArray(e.weeklyOff)) e.weeklyOff=[]; });
}
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){state=JSON.parse(raw);migrate();return}
  }catch(e){}
  // seed minimal starter data only if nothing stored
  state={
    employees:[
      {id:uid(),name:'سارة أحمد',num:'1001',dept:'Front Office',team:'A',title:'Receptionist',phone:'',email:'',status:'active'},
      {id:uid(),name:'محمد علي',num:'1002',dept:'Kitchen',team:'B',title:'Chef',phone:'',email:'',status:'active'},
      {id:uid(),name:'ليلى حسن',num:'1003',dept:'Front Office',team:'A',title:'Supervisor',phone:'',email:'',status:'active'}
    ],
    shifts:[], breakTypes:JSON.parse(JSON.stringify(DEFAULT_BREAK_TYPES)), daysOff:[],
    colors:JSON.parse(JSON.stringify(DEFAULT_COLORS)), settings:{}, log:[]
  };
  persist();
}
function logAction(action,detail){ state.log.unshift({id:uid(),ts:new Date().toISOString(),action,detail}); state.log=state.log.slice(0,100); }
function persist(){ try{localStorage.setItem(STORE_KEY, JSON.stringify(state));}catch(e){console.error('save failed',e)} }
// =====================================================================================

// Everything runs inside this browser. It keeps casual users out, but it is NOT real

// the server edition (schedule-wfm.js).

const USERS_KEY='wfm_users_v1', AUDIT_KEY='wfm_audit_v1', SESS_KEY='wfm_session_v1';

    const am=new Map((a[k]||[]).map(x=>[x.id,x])), bm=new Map((b[k]||[]).map(x=>[x.id,x]));

function t(ar,en){return lang==='ar'?ar:en}

function toMin(hhmm){const [h,m]=hhmm.split(':').map(Number);return h*60+m}
function fmtMin(mins){const h=Math.floor(mins/60)%24,m=mins%60;return (h+'').padStart(2,'0')+':'+(m+'').padStart(2,'0')}

// shift start/end stored as "HH:MM"; end may be next-day (earlier number) -> duration computed with wrap
function shiftDuration(s){
  let start=toMin(s.start), end=toMin(s.end);
  if(end<=start) end+=24*60;
  return end-start;
}
function breakDuration(b){
  let start=toMin(b.start), end=toMin(b.end);
  if(end<=start) end+=24*60;
  return end-start;
}
function totalBreakMin(s){return (s.breaks||[]).reduce((a,b)=>a+breakDuration(b),0)}
function shiftCategory(start){ const h=toMin(start)/60; if(h<12) return 'morning'; if(h<18) return 'evening'; return 'night'; }
function dayOffsFor(empId,date){ return state.daysOff.filter(d=>d.empId===empId && date>=d.start && date<=d.end); }
function hasDayOffConflict(empId,date){ return dayOffsFor(empId,date).length>0; }

function filteredEmployees(){
  const g=id=>{ const el=document.getElementById(id); return el?el.value:''; };
  const dept=g('fDept'), emp=g('fEmp'), st=g('fStatus'), q=g('fSearch').trim().toLowerCase();
  return state.employees.filter(e=>{
    if(e.status==='inactive') return false;
    if(dept&&e.dept!==dept) return false;
    if(emp&&e.id!==emp) return false;
    if(q&&!([e.name,e.num,e.dept,e.team,e.title].some(v=>String(v==null?'':v).toLowerCase().includes(q)))) return false;
    if(st){
      const mine=state.shifts.filter(s=>s.empId===e.id&&s.date===currentDate);
      if(st==='noshift'&&mine.length) return false;
      if(st==='leave'&&!dayOffsFor(e.id,currentDate).length) return false;
      if((st==='scheduled'||st==='completed')&&!mine.some(s=>(s.status||'scheduled')===st)) return false;
    }
    return true;
  });
}
function shiftsOn(date){
  const st=document.getElementById('fStatus')?document.getElementById('fStatus').value:'';
  const f=(st==='scheduled'||st==='completed')?st:'';
  return state.shifts.filter(s=>s.date===date && (!f||(s.status||'scheduled')===f));
}

const TL_KEY='wfm_ui_v1', PX_HOUR=72;
const LEAVE_NAMES={weekly:'Weekly off',annual:'Annual leave',sick:'Sick leave',holiday:'Official holiday',emergency:'Emergency leave',custom:'Leave'};
let tl=(function(){ const d={zoom:window.innerWidth<760?0.7:1,auto:false,start:8,end:24}; try{ Object.assign(d,JSON.parse(localStorage.getItem(TL_KEY)||'{}')); }catch(e){} d.zoom=Math.min(3,Math.max(0.4,+d.zoom||1)); return d; })();

function hexShade(hex,amt){ const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return hex||'#2d5f8a'; const n=parseInt(m[1],16); const f=c=>Math.max(0,Math.min(255,Math.round(amt<0?c*(1+amt):c+(255-c)*amt))); return '#'+[16,8,0].map(s=>f((n>>s)&255).toString(16).padStart(2,'0')).join(''); }

const durTxt=m=>(m/60).toFixed(m%60?1:0)+'h';
function tlWindow(day,spill){
  if(tl.auto){
    let lo=1e9,hi=-1; day.forEach(s=>{ const a=toMin(s.start); lo=Math.min(lo,a); hi=Math.max(hi,a+shiftDuration(s)); });
    spill.forEach(x=>{ lo=0; hi=Math.max(hi,x.end); });

}
function renderReports(){
  const day=shiftsOn(currentDate), emps=filteredEmployees(), ids=new Set(emps.map(e=>e.id));
  const mine=day.filter(s=>ids.has(s.empId));
  const totalWork=mine.reduce((a,s)=>a+shiftDuration(s),0), totalBreak=mine.reduce((a,s)=>a+totalBreakMin(s),0);
  const sched=new Set(mine.map(s=>s.empId)), unscheduled=emps.filter(e=>!sched.has(e.id)).length;
  // coverage = hours of the day during which at least one employee is on shift (union of all shifts)
  const iv=mine.map(s=>[toMin(s.start),toMin(s.start)+shiftDuration(s)]).sort((a,b)=>a[0]-b[0]); let cov=0,cs=-1,ce=-1;
  iv.forEach(([a,b])=>{ if(a>ce){ cov+=Math.max(0,ce-cs); cs=a; ce=b; } else ce=Math.max(ce,b); }); cov+=Math.max(0,ce-cs);
  const cards=[
    [(totalWork/60).toFixed(1)+'h',t('إجمالي ساعات العمل','Work hours')],
    [(totalBreak/60).toFixed(1)+'h',t('ساعات البريك','Break hours')],
    [sched.size,t('موظفون مجدولون','Employees scheduled')],
    [(cov/60).toFixed(1)+'h',t('ساعات التغطية','Coverage hours')],
    [unscheduled,t('بدون شيفت','Without shift')]
  ];
  document.getElementById('reports').innerHTML=cards.map(c=>`<div class="rcard"><div class="num">${c[0]}</div><div class="lbl">${c[1]}</div></div>`).join('');

      let inner='';
      if(height>=48) inner=`<b>${s.start} – ${s.end}</b><span>${durTxt(dur)}${brkN?' · '+brkN+' brk':''}</span>`; else if(height>=28) inner=`<b>${s.start}–${s.end}</b>`;
      let html=`<div class="shift-block${from<A?' clipT':''}${to>B?' clipB':''}${s.status==='completed'?' done':''}" style="top:${top}px;height:${height}px;background:linear-gradient(180deg,${hexShade(col,.14)},${col} 55%,${hexShade(col,-.2)});color:${fg}" data-id="${s.id}" title="${esc(tip)}">${inner}</div>`;
      (s.breaks||[]).forEach((br,bi)=>{
        const bs=base+((toMin(br.start)-toMin(s.start)+1440)%1440), be=bs+breakDuration(br);
        const x1=Math.max(bs,a), x2=Math.min(be,b); if(x2<=x1) return;
        const bt=state.breakTypes.find(y=>y.id===br.type), bc=(bt&&bt.color)||'#c97f3a';
        const bTop=Math.round((x1-A)*ppm), bH=Math.max(3,Math.round((x2-x1)*ppm));
        html+=`<div class="brk" style="top:${bTop}px;height:${bH}px;background:${esc(bc)};color:${textOn(bc)}" data-sid="${s.id}" data-bi="${bi}" title="${esc((bt?bt.name:br.type)+' '+br.start+'–'+br.end)}">${bH>=18?esc((bt?bt.name:br.type).slice(0,10)):''}</div>`;
      });
      return html;
    };
    day.filter(s=>s.empId===e.id).forEach(s=>{ const s0=toMin(s.start); blocks+=draw(s,s0,s0+shiftDuration(s),s0); });
    spill.filter(x=>x.sh.empId===e.id).forEach(x=>{ const s0=toMin(x.sh.start)-1440; blocks+=draw(x.sh,0,x.end,s0); });
    colsHtml+=`<div class="tl-col" data-emp="${e.id}" style="height:${totalH}px">${blocks}<div class="empty-hint">+</div></div>`;
  });

  if(!emps.length){
    $('viewTimeline').innerHTML=`<div class="tlx-wrap" style="padding:40px;text-align:center;color:var(--sub)">${t('لا يوجد موظفون مطابقون','No matching employees')}</div>`;
    return;
  }

  const old=document.querySelector('#viewTimeline .tlx-wrap'), stp=old?old.scrollTop:0, sl=old?old.scrollLeft:0;
  $('viewTimeline').innerHTML=`<div class="tlx-wrap"><div class="tl-inner">
    <div class="tl-header-row">
      <div class="tl-corner">${t('الوقت','Time')} · ${emps.length}</div>
      <div class="tl-emps-h">${emps.map(e=>`<div class="tl-emp-h"><b dir="auto" title="${esc(e.name)}">${esc(e.name)}</b><small dir="auto">#${esc(e.num||'')}${e.dept?' · '+esc(e.dept):''}</small></div>`).join('')}</div>
    </div>
    <div class="tl-body-row">
      <div class="tl-time-col" style="height:${totalH}px;position:relative">${timeHtml}</div>
      <div class="tl-cols">${colsHtml}</div>
    </div>
  </div></div>`;

  const wrap=document.querySelector('#viewTimeline .tlx-wrap');
  if(tlLast.date!==currentDate){ tlLast.date=currentDate; wrap.scrollTop=(isToday&&nowTop!==null)?Math.max(0,nowTop-wrap.clientHeight/3):0; wrap.scrollLeft=0; }
  else { wrap.scrollTop=stp; wrap.scrollLeft=sl; }

  wrap.querySelectorAll('.shift-block').forEach(el=>el.onclick=ev=>{ ev.stopPropagation(); openShiftModal(el.dataset.id); });
  wrap.querySelectorAll('.brk').forEach(el=>el.onclick=ev=>{ ev.stopPropagation(); openShiftModal(el.dataset.sid); setTimeout(()=>{ const r=document.querySelectorAll('#shiftOverlay .breakrow')[+el.dataset.bi]; if(r){ r.classList.add('hl'); r.scrollIntoView({block:'center'}); } },40); });
  wrap.querySelectorAll('.tl-col').forEach(el=>el.onclick=ev=>{
    if(ev.target.closest('.shift-block,.brk')) return;
    const rect=el.getBoundingClientRect();
    const pct=(ev.clientY-rect.top)/rect.height;
    const mins=Math.round((tlLast.A + pct*totalMin)/15)*15;
    openShiftModal(null, el.dataset.emp, fmtMin(((mins%1440)+1440)%1440));
  });
}
function tlZoomBy(d){ tl.zoom=Math.min(3,Math.max(0.4,Math.round((tl.zoom+d)*100)/100)); tlSave(); renderTimeline(); }

function renderCards(){

        <div class="row"><span>${t('عمل','Work')}</span><b>${(dur/60).toFixed(1)}h</b></div>
        <div class="row"><span>${t('بريك','Break')}</span><b>${(brk/60).toFixed(1)}h · ${ (s.breaks||[]).length }</b></div>
        <div class="actions"><button class="btn editS" data-id="${s.id}">${t('تعديل','Edit')}</button><button class="btn danger delS" data-id="${s.id}">${t('حذف','Delete')}</button></div>

  document.querySelectorAll('.addS').forEach(b=>b.onclick=()=>openShiftModal(null,b.dataset.emp));
}

function openShiftModal(id, empId, startTime){
  const ov=document.getElementById('shiftOverlay');
  document.getElementById('sEmp').innerHTML=state.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  document.getElementById('shiftErr').textContent='';
  if(id){
    const s=state.shifts.find(x=>x.id===id);

    document.getElementById('shiftId').value=s.id;
    document.getElementById('sEmp').value=s.empId;
    document.getElementById('sDate').value=s.date;
    document.getElementById('sStart').value=s.start;
    document.getElementById('sEnd').value=s.end;
    document.getElementById('sStatus').value=s.status||'scheduled';
    tempBreaks=JSON.parse(JSON.stringify(s.breaks||[]));
    document.getElementById('delShiftBtn').style.display='inline-block';
  }else{
    document.getElementById('shiftModalTitle').textContent=t('شيفت جديد','New shift');
    document.getElementById('shiftId').value='';
    if(empId) document.getElementById('sEmp').value=empId;
    document.getElementById('sDate').value=currentDate;
    document.getElementById('sStart').value=startTime||'09:00';
    document.getElementById('sEnd').value='17:00';
    document.getElementById('sStatus').value='scheduled';
    tempBreaks=[];
    document.getElementById('delShiftBtn').style.display='none';
  }
  renderBreakList();
  ov.classList.add('open');
}
function renderBreakList(){
  const el=document.getElementById('breakList');
  if(!tempBreaks.length){ el.innerHTML=`<div style="color:var(--sub);font-size:12px">${t('لا يوجد بريك','No breaks')}</div>`; return; }
  el.innerHTML=tempBreaks.map((b,i)=>`
    <div class="breakrow">
      <select data-i="${i}" class="brkType">
        ${state.breakTypes.map(bt=>`<option value="${bt.id}" ${b.type===bt.id?'selected':''}>${bt.name}</option>`).join('')}
      </select>
      <input type="time" data-i="${i}" class="brkStart" value="${b.start}">
      <input type="time" data-i="${i}" class="brkEnd" value="${b.end}">
      <button class="btn danger rmBrk" data-i="${i}" style="padding:4px 8px">✕</button>
    </div>`).join('');
  el.querySelectorAll('.brkType').forEach(x=>x.onchange=e=>tempBreaks[e.target.dataset.i].type=e.target.value);
  el.querySelectorAll('.brkStart').forEach(x=>x.onchange=e=>tempBreaks[e.target.dataset.i].start=e.target.value);
  el.querySelectorAll('.brkEnd').forEach(x=>x.onchange=e=>tempBreaks[e.target.dataset.i].end=e.target.value);
  el.querySelectorAll('.rmBrk').forEach(x=>x.onclick=e=>{tempBreaks.splice(e.target.dataset.i,1);renderBreakList();});
}
document.getElementById('addBreakBtn').onclick=()=>{ tempBreaks.push({id:uid(),type:(state.breakTypes[0]||{}).id||'break',start:'12:00',end:'12:15'}); renderBreakList(); };

document.getElementById('saveShiftBtn').onclick=()=>{
  const id=document.getElementById('shiftId').value;
  const empId=document.getElementById('sEmp').value;
  const date=document.getElementById('sDate').value;
  const start=document.getElementById('sStart').value;
  const end=document.getElementById('sEnd').value;
  const status=document.getElementById('sStatus').value;
  const errEl=document.getElementById('shiftErr');
  if(!empId||!date||!start||!end){ errEl.textContent=t('الرجاء استكمال جميع الحقول','Please fill all fields'); return; }
  const dur=shiftDuration({start,end});
  if(dur<=0 || dur>20*60){ errEl.textContent=t('وقت غير صحيح','Invalid time range'); return; }
  if(hasDayOffConflict(empId,date)){ errEl.textContent=t('يوجد إجازة معتمدة لهذا الموظف في هذا التاريخ','This employee has an approved day off on this date'); return; }
  for(const b of tempBreaks){
    let bs=toMin(b.start)-toMin(start); if(bs<0) bs+=24*60;
    const bd=breakDuration(b);
    if(bs<0 || bs+bd>dur){ errEl.textContent=t('البريك يجب أن يكون داخل وقت الشيفت','Breaks must stay inside the shift'); return; }
  }
  // overlap check (same employee, same date, excluding this shift)
  const overlap=state.shifts.some(s=>s.empId===empId && s.date===date && s.id!==id &&
    !( toMin(end)<=toMin(start)? false : (toMin(end)<=toMin(s.start)||toMin(start)>=toMin(s.end)) ) && false);
  const empName=(state.employees.find(x=>x.id===empId)||{}).name||empId;
  if(id){
    const s=state.shifts.find(x=>x.id===id);
    Object.assign(s,{empId,date,start,end,status,breaks:tempBreaks});
    logAction('Edit shift',empName+' '+date);
  }else{
    state.shifts.push({id:uid(),empId,date,start,end,status,breaks:tempBreaks});
    logAction('Add shift',empName+' '+date);
  }
  save(); closeShiftModal(); render(); if(adminMode) renderAdmin();
};
document.getElementById('delShiftBtn').onclick=()=>{
  const id=document.getElementById('shiftId').value;
  if(confirm(t('حذف الشيفت؟','Delete this shift?'))){ state.shifts=state.shifts.filter(s=>s.id!==id); logAction('Delete shift',id); save(); closeShiftModal(); render(); if(adminMode) renderAdmin(); }

  const unassigned=state.employees.filter(e=>!assignedIds.has(e.id)).length;
  const totalBreaks=state.shifts.reduce((a,s)=>a+(s.breaks||[]).length,0);
  const cards=[['Total employees',state.employees.length],['Total shifts',state.shifts.length],['Total breaks',totalBreaks],
    ['Total days off',state.daysOff.length],['Active employees',active],['Unassigned employees',unassigned]];

function openDoModal(id){
  document.getElementById('doEmp').innerHTML=state.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  document.getElementById('doErr').textContent='';
  if(id){
    const d=state.daysOff.find(x=>x.id===id);
    document.getElementById('doModalTitle').textContent='Edit day off';
    document.getElementById('doId').value=d.id; document.getElementById('doEmp').value=d.empId; document.getElementById('doType').value=d.type;
    document.getElementById('doStart').value=d.start; document.getElementById('doEnd').value=d.end;
    document.getElementById('delDoBtn').style.display='inline-block';
  }else{
    document.getElementById('doModalTitle').textContent='New day off';
    document.getElementById('doId').value=''; document.getElementById('doStart').value=currentDate; document.getElementById('doEnd').value=currentDate;
    document.getElementById('delDoBtn').style.display='none';
  }
  document.getElementById('daysOffOverlay').classList.add('open');
}
document.getElementById('cancelDoBtn').onclick=()=>document.getElementById('daysOffOverlay').classList.remove('open');
document.getElementById('saveDoBtn').onclick=()=>{
  const id=document.getElementById('doId').value, empId=document.getElementById('doEmp').value, type=document.getElementById('doType').value;
  const start=document.getElementById('doStart').value, end=document.getElementById('doEnd').value;
  if(!empId||!start||!end||end<start){ document.getElementById('doErr').textContent='Please check the dates'; return; }
  const conflict=state.shifts.some(s=>s.empId===empId && s.date>=start && s.date<=end);
  if(conflict && !confirm('This employee already has shifts in this range. Add the day off anyway?')) return;
  if(id){ Object.assign(state.daysOff.find(d=>d.id===id),{empId,type,start,end}); }
  else{ state.daysOff.push({id:uid(),empId,type,start,end}); }
  logAction('Save day off',empId); save();
  document.getElementById('daysOffOverlay').classList.remove('open'); render(); renderAdmin();
};
document.getElementById('delDoBtn').onclick=()=>{
  const id=document.getElementById('doId').value;
  state.daysOff=state.daysOff.filter(d=>d.id!==id); save();
  document.getElementById('daysOffOverlay').classList.remove('open'); render(); renderAdmin();
};

const DAY_ALIAS={sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6,'الأحد':0,'الاحد':0,'الاثنين':1,'الإثنين':1,'الثلاثاء':2,'الأربعاء':3,'الاربعاء':3,'الخميس':4,'الجمعة':5,'السبت':6};
const BAD_CHARS=/[<>"`]/, HEX6=/^#[0-9a-fA-F]{6}$/, TIME_RE=/^([01]\d|2[0-3]):[0-5]\d$/;
const dstr=dt=>dt.toISOString().slice(0,10);
function datesBetween(a,b){ const out=[]; let d=new Date(a+'T00:00:00Z'); const e=new Date(b+'T00:00:00Z'); while(d<=e){ out.push(dstr(d)); d=new Date(d.getTime()+86400000); } return out; }

// ---------------- Excel reading / writing (JSZip is embedded; nothing is sent anywhere) ----------------
function colIdx(ref){ const m=/^([A-Z]+)/i.exec(ref||''); if(!m) return 0; let n=0; for(const ch of m[1].toUpperCase()) n=n*26+ch.charCodeAt(0)-64; return n-1; }
function colLetter(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function decodeText(buf){ try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ try{ return new TextDecoder('windows-1256').decode(buf); }catch(e2){ return new TextDecoder().decode(buf); } } }
function parseCsv(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cur); cur=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; rows.push(row); row=[]; }
    else cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function readXlsx(buf){
  const z=await JSZip.loadAsync(buf);
  const xml=async p=>{ const f=z.file(p); return f?new DOMParser().parseFromString(await f.async('string'),'application/xml'):null; };
  const wb=await xml('xl/workbook.xml'); if(!wb) throw new Error('Not a valid XLSX file');
  const rels=await xml('xl/_rels/workbook.xml.rels'); const relMap={};
  if(rels) for(const r of rels.getElementsByTagName('Relationship')) relMap[r.getAttribute('Id')]=r.getAttribute('Target');
  const ss=[]; const sx=await xml('xl/sharedStrings.xml');
  if(sx) for(const si of sx.getElementsByTagName('si')){ let s=''; for(const ch of si.children){ if(ch.tagName==='t') s+=ch.textContent; else if(ch.tagName==='r'){ for(const t of ch.children) if(t.tagName==='t') s+=t.textContent; } } ss.push(s); }
  const sheets={};
  for(const sh of wb.getElementsByTagName('sheet')){
    const name=sh.getAttribute('name');
    const rid=sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||sh.getAttribute('r:id');
    let target=(relMap[rid]||'').replace(/^\//,''); if(!target.startsWith('xl/')) target='xl/'+target;
    const sd=await xml(target); if(!sd) continue;
    const rows=[]; let auto=0;
    for(const row of sd.getElementsByTagName('row')){
      const rr=row.getAttribute('r'); const ri=rr?parseInt(rr)-1:auto; auto=ri+1; let ci=0;
      for(const c of row.getElementsByTagName('c')){
        const ref=c.getAttribute('r'); if(ref) ci=colIdx(ref);
        const t=c.getAttribute('t'); let v='';
        if(t==='inlineStr') v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
        else { const ve=c.getElementsByTagName('v')[0]; v=ve?ve.textContent:''; if(t==='s') v=ss[+v]||''; else if(t==='b') v=v==='1'?'TRUE':'FALSE'; }
        (rows[ri]=rows[ri]||[])[ci]=v; ci++;
      }
    }
    const dense=Array.from(rows,r=>Array.from(r||[],c=>c==null?'':c));
    while(dense.length&&dense[dense.length-1].every(c=>String(c).trim()==='')) dense.pop();
    sheets[name]=dense;
  }
  if(!Object.keys(sheets).length) throw new Error('No worksheets found');
  return {sheets};
}
function loadSheetJS(){ return new Promise((res,rej)=>{ if(window.XLSX) return res(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload=res; s.onerror=()=>rej(new Error('Old .xls files need an internet connection (SheetJS). Open the file in Excel and save it as .xlsx, then import again.')); document.head.appendChild(s); }); }
async function readWorkbookFile(file){
  const n=file.name.toLowerCase(), buf=await file.arrayBuffer();
  if(/\.(csv|txt)$/.test(n)) return {sheets:{CSV:parseCsv(decodeText(buf))}};
  if(/\.(xlsx|xlsm)$/.test(n)) return readXlsx(buf);
  if(/\.xls$/.test(n)){ await loadSheetJS(); const wb=XLSX.read(buf,{type:'array'}); const sheets={}; wb.SheetNames.forEach(s=>sheets[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,raw:false,defval:''})); return {sheets}; }
  throw new Error('Unsupported file type. Use .xlsx, .xls or .csv');
}
const xesc=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function safeCell(v){ let s=String(v==null?'':v); if(/^[=@]/.test(s)||(/^[+-]/.test(s)&&/[A-Za-z]/.test(s))) s="'"+s; return s; } // spreadsheet formula-injection guard
async function xlsxBlob(sheets){
  const z=new JSZip(); const used=new Set();
  const names=sheets.map((s,i)=>{ let n=String(s.name||'Sheet'+(i+1)).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31)||'Sheet'+(i+1); while(used.has(n.toLowerCase())) n=n.slice(0,28)+'_'+i; used.add(n.toLowerCase()); return n; });
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file('xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+names.map((n,i)=>'<sheet name="'+xesc(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>');
  z.file('xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  z.file('xl/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFD9E8EC"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>');
  sheets.forEach((s,i)=>{
    const rows=s.rows||[]; const w=[]; rows.forEach(r=>r.forEach((c,j)=>{ w[j]=Math.min(45,Math.max(w[j]||8,String(c==null?'':c).length+2)); }));
    let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'+w.map((n,j)=>'<col min="'+(j+1)+'" max="'+(j+1)+'" width="'+n+'" customWidth="1"/>').join('')+'</cols><sheetData>';
    rows.forEach((r,ri)=>{ x+='<row r="'+(ri+1)+'">'; r.forEach((c,ci)=>{ const ref=colLetter(ci)+(ri+1);
      if(typeof c==='number'&&isFinite(c)) x+='<c r="'+ref+'"><v>'+c+'</v></c>';
      else x+='<c r="'+ref+'" t="inlineStr"'+(ri===0?' s="1"':'')+'><is><t xml:space="preserve">'+xesc(ri===0?c:safeCell(c))+'</t></is></c>'; }); x+='</row>'; });
    z.file('xl/worksheets/sheet'+(i+1)+'.xml',x+'</sheetData></worksheet>');
  });
  return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function downloadXlsx(filename,sheets){
  const blob=await xlsxBlob(sheets); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

function freshImp(){ return {useRoster:true,roster:null,rosterPlan:null,rOpt:{mode:'add',replace:false,dept:'Section',team:'Company',title:'',confirm:false,year:new Date().getFullYear()},screen:1,fname:'',sheets:null,sheet:'',hasHeader:true,map:{},recs:null,mode:'add',confirm:false,result:null,err:'',busy:false}; }

const normHdr=s=>String(s||'').toLowerCase().replace(/[_\-.]+/g,' ').replace(/\s+/g,' ').trim();
function autoMap(){
  const rows=imp.sheets[imp.sheet]||[]; const hdr=imp.hasHeader?(rows[0]||[]):[]; imp.map={};
  EMP_FIELDS.forEach(f=>{ const i=hdr.findIndex(h=>f.alias.includes(normHdr(h))||normHdr(h)===normHdr(f.label)); if(i>=0) imp.map[f.k]=String(i); });
}
function parseOff(raw){
  const out=new Set(), bad=[];
  String(raw||'').split(/[,;/|،\s]+/).filter(Boolean).forEach(tok=>{ const k=DAY_ALIAS[tok.toLowerCase()]; if(k===undefined) bad.push(tok); else out.add(k); });
  return {days:[...out].sort(),bad};
}
function validateImport(){
  const rows=imp.sheets[imp.sheet]||[]; const start=imp.hasHeader?1:0; const recs=[];
  const g=(r,k)=>{ const i=imp.map[k]; if(i===''||i===undefined) return ''; return String(r[+i]==null?'':r[+i]).trim(); };
  const tplByName=new Map((state.shiftTemplates||[]).map(t=>[t.name.toLowerCase(),t]));
  for(let i=start;i<rows.length;i++){
    const r=rows[i]||[]; if(r.every(c=>String(c==null?'':c).trim()==='')) continue;
    const rec={row:i+1,raw:{},d:{},errors:[],ex:null,dup:null};
    EMP_FIELDS.forEach(f=>rec.raw[f.k]=g(r,f.k));
    const R=rec.raw, D=rec.d;
    D.num=R.num.replace(/^(\d+)\.0+$/,'$1'); D.name=R.name;
    if(!D.num) rec.errors.push('Missing Employee ID');
    else if(D.num.length>30||BAD_CHARS.test(D.num)) rec.errors.push('Invalid Employee ID');
    if(!D.name) rec.errors.push('Missing Employee Name'); else if(D.name.length>100) rec.errors.push('Name too long');
    ['name','dept','team','title'].forEach(k=>{ if(R[k]&&BAD_CHARS.test(R[k])) rec.errors.push('Invalid characters in '+k+' (< > " `)'); if(R[k]&&R[k].length>100) rec.errors.push(k+' too long'); });
    D.dept=R.dept; D.team=R.team; D.title=R.title;
    if(R.email&&!/^[^\s@<>"]+@[^\s@<>"]+\.[^\s@<>"]+$/.test(R.email)) rec.errors.push('Invalid email'); D.email=R.email;
    if(R.phone&&!/^[0-9+\-()\s.]{5,20}$/.test(R.phone)) rec.errors.push('Invalid phone number'); D.phone=R.phone;
    if(R.status){ const s=R.status.toLowerCase();
      if(['active','نشط','فعال','1','yes','true','y'].includes(s)) D.status='active';
      else if(['inactive','غير نشط','معطل','disabled','terminated','0','no','false','n'].includes(s)) D.status='inactive';
      else rec.errors.push('Invalid employment status "'+R.status+'"'); }
    if(R.tplName){ const t=tplByName.get(R.tplName.toLowerCase()); if(!t) rec.errors.push('Unknown shift template "'+R.tplName+'"'); else D.tpl=t.id; }
    if(R.offDays){ const o=parseOff(R.offDays); if(o.bad.length) rec.errors.push('Invalid weekly off day: '+o.bad.join(', ')); else D.weeklyOff=o.days; }
    recs.push(rec);
  }
  const byId=new Map(); recs.forEach(r=>{ if(r.d.num){ const k=r.d.num.toLowerCase(); (byId.get(k)||byId.set(k,[]).get(k)).push(r); } });
  byId.forEach(list=>{ if(list.length>1){ const rowsTxt=list.map(x=>x.row).join(', '); list.forEach(x=>{ x.dup=rowsTxt; x.errors.push('Duplicate Employee ID in file (rows '+rowsTxt+')'); }); } });
  recs.forEach(r=>{ if(!r.d.num) return; const m=state.employees.filter(e=>String(e.num)===r.d.num); if(m.length>1) r.errors.push('ID matches several existing employees'); else if(m.length===1) r.ex=m[0]; });
  recs.forEach(r=>r.status=r.errors.length?'error':(r.ex?'existing':'new'));
  imp.recs=recs;
}
const UPD_KEYS=['name','dept','team','title','phone','email','status','tpl','weeklyOff'];
function changesFor(rec){ // only mapped, non-empty cells overwrite; blank cells never erase data
  const ch=[]; UPD_KEYS.forEach(k=>{ const nv=rec.d[k]; if(nv===undefined||nv==='') return; const ov=rec.ex[k]; if(JSON.stringify(ov===undefined?'':ov)!==JSON.stringify(nv)) ch.push({k,from:ov===undefined?'':ov,to:nv}); }); return ch; }
function importPlan(){
  const m=imp.mode, recs=imp.recs||[]; const p={add:[],upd:[],unchanged:0,skipExisting:0,skipNew:0,err:0};
  recs.forEach(r=>{ if(r.status==='error'){ p.err++; return; }
    if(r.status==='new'){ if(m==='add'||m==='both') p.add.push(r); else p.skipNew++; }
    else { if(m==='add') p.skipExisting++; else { const c=changesFor(r); if(c.length) p.upd.push({r,c}); else p.unchanged++; } } });
  return p;
}
function applyImport(){
  if(!canWrite()) throw new Error('Forbidden');
  const p=importPlan(); const list=JSON.parse(JSON.stringify(state.employees));
  p.upd.forEach(({r,c})=>{ const e=list.find(x=>x.id===r.ex.id); c.forEach(x=>{ e[x.k]=x.to; }); });
  p.add.forEach(r=>list.push({id:uid(),num:r.d.num,name:r.d.name,dept:r.d.dept||'',team:r.d.team||'',title:r.d.title||'',phone:r.d.phone||'',email:r.d.email||'',status:r.d.status||'active',tpl:r.d.tpl||'',weeklyOff:r.d.weeklyOff||[]}));
  const nums=new Set(); for(const e of list){ const k=String(e.num||'').toLowerCase(); if(k){ if(nums.has(k)) throw new Error('Duplicate Employee ID '+e.num+' - import cancelled, nothing changed'); nums.add(k); } }
  state.employees=list; // all-or-nothing: one swap, one save
  state.importHistory=state.importHistory||[];
  const rec={id:uid(),ts:new Date().toISOString(),user:me.username,file:imp.fname,sheet:imp.sheet,mode:imp.mode,added:p.add.length,updated:p.upd.length,skipped:p.skipExisting+p.skipNew+p.unchanged,errors:p.err};
  state.importHistory.unshift(rec); state.importHistory=state.importHistory.slice(0,100);
  logAction('Import employees',imp.fname); save(); audit('import.run',imp.fname,`mode=${imp.mode} added=${rec.added} updated=${rec.updated} errors=${rec.errors}`);
  return rec;
}

}

}

const today0=()=>localISO(new Date());
let bcfg={scope:'all',dept:'',team:'',ids:[],mode:'same',tpl:'',useDef:false,brk:[],start:today0(),end:dstr(new Date(Date.now()+6*86400000)),useEmpOff:false,off:[5,6],byTeam:{},rot:['','','',''],rotDays:7,stagger:true,weekly:{},replace:false};

function genPreview(){
  const c=JSON.parse(JSON.stringify(bcfg)), emps=bulkEmps(), tpls=state.shiftTemplates||[];
  if(!emps.length) return 'Select at least one active employee';
  if(!c.start||!c.end||c.end<c.start) return 'Choose a valid start and end date';
  const dates=datesBetween(c.start,c.end); if(dates.length>62) return 'Maximum range is 62 days';
  if(!tpls.length) return 'Create a shift template first (Templates page)';
  if(c.mode==='same'&&!c.tpl&&!c.useDef) return 'Select a shift template';
  if(c.mode==='rotating'&&!c.rot.some(Boolean)) return 'Select at least one template for the rotation';
  if(c.mode==='weekly'&&!Object.values(c.weekly).some(Boolean)) return 'Assign a template to at least one weekday';
  const cells={};
  emps.forEach((e,i)=>{ cells[e.id]={}; const eo=(c.useEmpOff&&e.weeklyOff&&e.weeklyOff.length)?e.weeklyOff:c.off;
    dates.forEach((d,di)=>{ const dow=dowOf(d); let v='';
      if(c.mode==='weekly') v=c.weekly[dow]||'OFF';
      else if(c.mode==='custom') v='';
      else if(eo.includes(dow)) v='OFF';
      else if(c.mode==='same') v=(c.useDef&&e.tpl&&tplById(e.tpl))?e.tpl:(c.tpl||'');
      else if(c.mode==='byteam') v=c.byTeam[e.team||'']||'';
      else if(c.mode==='rotating'){ const r=c.rot.filter(Boolean); v=r[(Math.floor(di/c.rotDays)+(c.stagger?i:0))%r.length]; }
      if(v&&v!=='OFF'&&!tplById(v)) v='';
      cells[e.id][d]=v; }); });
  gen={cfg:c,emps:emps.map(e=>e.id),dates,cells,approved:false,sx:0,sy:0};
  return '';
}
function analyze(){
  const g=gen, c=g.cfg, issues=[], flag={}; const add=(level,kind,emp,date,msg)=>{ issues.push({level,kind,emp,date,msg}); const k=emp+'|'+date; (flag[k]=flag[k]||{level:'info',msgs:[]}); flag[k].msgs.push(msg); if(level==='block'||(level==='warn'&&flag[k].level!=='block')) flag[k].level=level; };
  const brk=c.brk.map(id=>(state.breakTemplates||[]).find(b=>b.id===id)).filter(Boolean);
  const live=[]; // generated shifts that will really be created
  g.emps.forEach(eid=>{
    const intervals=[]; const removeEx=new Set();
    g.dates.forEach(d=>{ const v=g.cells[eid][d]; const hasLeave=dayOffsFor(eid,d).length>0;
      if(v&&v!=='OFF'){
        const t=tplById(v); if(!t) return;
        if(hasLeave){ add('info','leave',eid,d,'Approved leave on this date - shift will be skipped'); return; }
        const ex=state.shifts.filter(s=>s.empId===eid&&s.date===d);
        if(ex.length){ if(c.replace){ ex.forEach(s=>removeEx.add(s.id)); add('info','replace',eid,d,'Existing shift will be replaced'); } else add('block','duplicate',eid,d,'Duplicate assignment: employee already has a shift on this date'); }
        const sdur=shiftDuration(t); const s0=dayIdx(d)*1440+toMin(t.start);
        intervals.push({s:s0,e:s0+sdur,gen:true,d,t});
        live.push({eid,d,t}); 
        const ivs=[]; brk.forEach(b=>{ const rel=(toMin(b.start)-toMin(t.start)+1440)%1440, bd=breakDuration(b);
          if(rel+bd>sdur) add('block','break',eid,d,`Break "${b.name}" falls outside shift "${t.name}"`); else ivs.push([rel,rel+bd,b.name]); });
        ivs.sort((a,b)=>a[0]-b[0]); for(let i=1;i<ivs.length;i++) if(ivs[i][0]<ivs[i-1][1]) add('block','break',eid,d,`Breaks "${ivs[i-1][2]}" and "${ivs[i][2]}" overlap`);
      }else if(v==='OFF'){
        if(!hasLeave&&state.shifts.some(s=>s.empId===eid&&s.date===d)) add('warn','offshift',eid,d,'Weekly off over an existing shift - off day will not be created');
      }else add('warn','missing',eid,d,'Missing assignment');
    });
    state.shifts.filter(s=>s.empId===eid&&!removeEx.has(s.id)).forEach(s=>{ const s0=dayIdx(s.date)*1440+toMin(s.start); intervals.push({s:s0,e:s0+shiftDuration(s),gen:false}); });
    intervals.sort((a,b)=>a.s-b.s);
    for(let i=0;i<intervals.length;i++) for(let j=i+1;j<intervals.length&&intervals[j].s<intervals[i].e;j++){ const A=intervals[i],B=intervals[j];
      if(A.gen&&B.gen) { add('block','conflict',eid,A.d,'Overlaps the shift on '+B.d); add('block','conflict',eid,B.d,'Overlaps the shift on '+A.d); }
      else if(A.gen) add('block','conflict',eid,A.d,'Overlaps an existing shift'); else if(B.gen) add('block','conflict',eid,B.d,'Overlaps an existing shift'); }
  });
  const count=l=>issues.filter(i=>i.level===l).length;
  const groups={}; issues.forEach(i=>{ const k=i.level+'|'+i.kind+'|'+i.msg.replace(/\d{4}-\d{2}-\d{2}/g,'…'); (groups[k]=groups[k]||{level:i.level,kind:i.kind,msg:i.msg,n:0,ex:[]}).n++; if(groups[k].ex.length<3) groups[k].ex.push(empLabel(i.emp)+' '+i.date); });
  return {issues,flag,live,blocking:count('block'),warnings:count('warn'),info:count('info'),groups:Object.values(groups).sort((a,b)=>({block:0,warn:1,info:2}[a.level]-{block:0,warn:1,info:2}[b.level]))};
}
function publishGen(){
  if(!canWrite()) throw new Error('Forbidden');
  const g=gen, c=g.cfg, A=analyze(); if(A.blocking) throw new Error('Resolve all blocking conflicts first');
  const brk=c.brk.map(id=>(state.breakTemplates||[]).find(b=>b.id===id)).filter(Boolean);
  const genId=uid(); const newShifts=[], newOff=[], rm=new Set(); let skippedLeave=0, replaced=0;
  g.emps.forEach(eid=>g.dates.forEach(d=>{ const v=g.cells[eid][d]; const leave=dayOffsFor(eid,d).length>0;
    if(v&&v!=='OFF'){ const t=tplById(v); if(!t) return; if(leave){ skippedLeave++; return; }
      state.shifts.filter(s=>s.empId===eid&&s.date===d).forEach(s=>{ if(c.replace){ rm.add(s.id); replaced++; } });
      const sdur=shiftDuration(t);
      const breaks=brk.filter(b=>((toMin(b.start)-toMin(t.start)+1440)%1440)+breakDuration(b)<=sdur).map(b=>({id:uid(),type:b.type,start:b.start,end:b.end}));
      newShifts.push({id:uid(),empId:eid,date:d,start:t.start,end:t.end,status:'scheduled',breaks,tplId:t.id,color:t.color,genId});
    }else if(v==='OFF'&&!leave&&!state.shifts.some(s=>s.empId===eid&&s.date===d)&&!newOff.some(o=>o.empId===eid&&o.start===d)){
      newOff.push({id:uid(),empId:eid,type:'weekly',start:d,end:d,genId}); } }));
  if(!newShifts.length&&!newOff.length) throw new Error('Nothing to publish');
  const nextShifts=state.shifts.filter(s=>!rm.has(s.id)).concat(newShifts), nextOff=state.daysOff.concat(newOff);

  return h;
}

// ---------------- Schedule roster (wide format: one row per employee, a Sch./Att./Logout/Case group per day) ----------------

function detectRoster(rows,yearHint){

    if(!sch.length) continue;

    let cols=null, hdrRow=-1;
    for(let k=0;k<=r&&!cols;k++){ const hr=rows[k]||[]; const f=n=>hr.findIndex(c=>n.test(Ls(c)));

    if(!cols) continue;

    const build=y0=>{ let y=y0,prev=days[0].m,hit=0,tot=0; const dates=days.map(d=>{ if(d.y) y=d.y; else if(d.m<prev) y++; prev=d.m; const ds=y+'-'+pad(d.m+1)+'-'+pad(d.d); if(d.dn&&DAY_ALIAS[d.dn]!==undefined){ tot++; if(dowOf(ds)===DAY_ALIAS[d.dn]) hit++; } return ds; }); return {y:y0,dates,tot,score:tot?hit/tot:0}; };
    let best=null; const cand=days[0].y?[days[0].y]:[yearHint,cy,cy-1,cy+1].filter((v,i,a)=>v&&a.indexOf(v)===i);
    for(const y0 of cand){ const b=build(y0); if(!best||b.score>best.score) best=b; if(b.score===1&&b.tot) break; }

    if(days.some(d=>new Date(d.date+'T00:00:00Z').toISOString().slice(0,10)!==d.date)) continue;

}
function classifyCell(v){
  const s=Ls(v); if(!s) return null;

  const m=/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/.exec(t);
  if(m){ const h1=+m[1],mi1=+m[2],h2=+m[3],mi2=+m[4];
    if(h1<=24&&h2<=24&&mi1<60&&mi2<60&&!(h1===24&&mi1>0)&&!(h2===24&&mi2>0)){ const f=(h,mi)=>String(h%24).padStart(2,'0')+':'+String(mi).padStart(2,'0'); const st=f(h1,mi1),en=f(h2,mi2); if(st!==en) return {k:'shift',start:st,end:en}; }

const cleanTxt=s=>Ls(s).replace(/[<>"`]/g,' ').replace(/\s+/g,' ').trim().slice(0,100);

const rosterPick=(p,k)=>k?(p[k.toLowerCase()]||''):'';

  state.importHistory.unshift(rec); state.importHistory=state.importHistory.slice(0,100);
  logAction('Import roster',imp.fname); save(); audit('import.roster',imp.fname,`period=${imp.roster.from}..${imp.roster.to} employees+${rec.added} updated=${rec.updated} shifts=${rec.shifts} leave=${rec.offs} templates+${C.tpls.length} skipped=${rec.skipped}`);
  return Object.assign({roster:true,tpls:C.tpls.length},rec);
}
function rosterScreen(){
  const R=imp.roster,P=imp.rosterPlan,o=imp.rOpt,C=rosterCompute();
  const optSel=(id,sel,blank)=>`<select id="${id}">`+[['',blank],['Section','Section'],['Gender','Gender'],['Company','Company'],['Bus','Bus']].map(([v,l])=>`<option value="${v}" ${sel===v?'selected':''}>${l}</option>`).join('')+'</select>';
  const need=(o.mode==='update'&&C.updE>0)||(o.replace&&(C.removeShiftIds.size||C.removedOff));
  const nothing=!(C.newE+C.updE+C.shifts.length+C.offs.length);
  const unk=Object.entries(C.unknown).sort((a,b)=>b[1]-a[1]);
  const offTxt=Object.entries(C.offDays).map(([k,v])=>`${v} ${k}`).join(', ')||'0';
  return `<p><span class="badge b-ok">${C.newE} new employees</span><span class="badge b-info">${C.existE} already in the system</span><span class="badge b-ok">${C.shifts.length} shifts</span><span class="badge b-info">${C.offs.length} off/leave records (${esc(offTxt)} days)</span><span class="badge b-info">${C.tpls.length} shift templates will be created</span>${C.skippedExisting?`<span class="badge b-warn">${C.skippedExisting} days skipped (already scheduled)</span>`:''}</p>
   <p class="muted">Period <b>${R.from} → ${R.to}</b> · ${R.days.length} days · ${P.emps.length} employees${R.matched?' · year confirmed from the weekday names':' · year taken from the field below'}</p>
   ${R.matched?'':`<div class="field" style="max-width:160px"><label>Year</label><input type="number" id="rYear" min="2000" max="2100" value="${o.year}"></div>`}
   <div class="twofield"><div class="field"><label>Department ← column</label>${optSel('rDept',o.dept,'— none —')}</div><div class="field"><label>Team ← column</label>${optSel('rTeam',o.team,'— none —')}</div></div>
   <div class="field" style="max-width:320px"><label>Job title ← column</label>${optSel('rTitle',o.title,'— none —')}</div>
   <small class="muted">Gender, Company, Bus and Login are always saved with each employee.</small>
   <div style="margin:10px 0"><label style="display:block"><input type="radio" name="rMode" value="add" ${o.mode==='add'?'checked':''}> <b>Add new employees only</b> — employees already in the system keep their details</label>
   <label style="display:block"><input type="radio" name="rMode" value="update" ${o.mode==='update'?'checked':''}> <b>Add new and update existing employee details</b></label></div>
   <label style="display:block;margin:6px 0"><input type="checkbox" id="rReplace" ${o.replace?'checked':''}> Replace existing shifts and days off in this period for the employees in the file <small class="muted">(otherwise days that already have a shift or day off are left untouched)</small></label>
   ${(P.info.dupSame||P.info.blank||P.notes.length||unk.length)?`<div class="warnbox" style="background:#1d2a3a;border-color:#3a5f8a;color:#cfe0f0"><b>Notes</b> (nothing is wrong, this is how the file was read):<ul style="margin:6px 0 0;padding-inline-start:18px">
     ${P.info.dupSame?`<li>${P.info.dupSame} duplicate row(s) with identical data were merged into one employee</li>`:''}
     ${P.info.blank?`<li>${P.info.blank} empty row(s) ignored</li>`:''}
     ${P.notes.slice(0,8).map(n=>`<li>${esc(n)}</li>`).join('')}
     ${unk.length?`<li>Schedule values not recognised (left unassigned): ${esc(unk.slice(0,6).map(([k,v])=>k+' ×'+v).join(', '))}</li>`:''}
     <li>Attendance (Att.), Logout and Case columns are not imported.</li></ul></div>`:''}
   ${need?`<label style="display:block;margin:10px 0"><input type="checkbox" id="rConfirm" ${o.confirm?'checked':''}> I confirm overwriting existing data: ${o.mode==='update'?C.updE+' employee record(s)':''} ${o.replace?C.removeShiftIds.size+' shift(s) and '+C.removedOff+' day-off record(s) in this period':''}</label>`:''}
   <div class="err">${esc(imp.err)}</div>
   <div class="actions"><button class="btn" id="impBack">Back</button><button class="btn primary" id="rRun" ${(nothing||(need&&!o.confirm))?'disabled':''}>${nothing?'Nothing new to import':'Import now'}</button></div>`;
}
function wireRoster(){
  const $=id=>document.getElementById(id), re=()=>renderAdmin(), o=imp.rOpt;
  const bind=(id,k)=>{ if($(id)) $(id).onchange=e=>{ o[k]=e.target.value; o.confirm=false; re(); }; };
  bind('rDept','dept'); bind('rTeam','team'); bind('rTitle','title');
  if($('rYear')) $('rYear').onchange=e=>{ o.year=parseInt(e.target.value)||o.year; imp.roster=detectRoster(imp.sheets[imp.sheet],o.year); imp.rosterPlan=buildRoster(); re(); };
  document.querySelectorAll('input[name=rMode]').forEach(r=>r.onchange=()=>{ o.mode=r.value; o.confirm=false; re(); });
  if($('rReplace')) $('rReplace').onchange=e=>{ o.replace=e.target.checked; o.confirm=false; re(); };
  if($('rConfirm')) $('rConfirm').onchange=e=>{ o.confirm=e.target.checked; re(); };
  if($('rRun')) $('rRun').onclick=()=>{ try{ imp.result=applyRoster(); imp.screen=8; render(); re(); toast('Roster imported'); }catch(x){ imp.err=x.message; re(); } };
}

// employee modal extras (default template + weekly off)
function fillEmpExtra(id){
  const e=id?state.employees.find(x=>x.id===id):null;
  document.getElementById('eTpl').innerHTML='<option value="">— none —</option>'+(state.shiftTemplates||[]).map(t=>`<option value="${t.id}" ${e&&e.tpl===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
  document.querySelectorAll('#eOff input').forEach(x=>{ x.checked=!!(e&&(e.weeklyOff||[]).includes(+x.value)); });
}
function wireTools(){ if(!canWrite()) return; if(adminPage==='import') wireImport(); else if(adminPage==='tpl') wireTemplates(); else if(adminPage==='bulk') wireBulk(); else if(adminPage==='export') wireExport(); }


boot();
</script>
